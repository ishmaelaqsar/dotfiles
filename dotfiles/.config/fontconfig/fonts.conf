<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Prefer the vendored 0xProto Nerd Font for monospace, so GTK and GNOME apps
    match the terminal. install.sh copies the TTFs to ~/.local/share/fonts.
    Ghostty picks the font by name and does not need this file.
  -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>0xProto Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
