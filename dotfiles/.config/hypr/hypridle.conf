# hypridle — the idle daemon Hyprland has no built-in equivalent for. GNOME
# locks and blanks by itself, so without this the Hyprland session only ever
# locks when Super+Escape is pressed.
#
# hyprland.conf starts it with exec-once, and lib/packages.conf installs it
# under the hyprland tag.

general {
    # The same hyprlock that Super+Escape runs, so one lock screen either way.
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before the machine suspends, so waking never shows the desktop.
    before_sleep_cmd = loginctl lock-session
    # And let the lock screen come up before the display returns.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Dim the backlight first, as a warning that the lock is coming. brightnessctl
# restores what it saved, so the level survives the dim.
listener {
    timeout = 480
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Blank the display after the lock, not before it.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
