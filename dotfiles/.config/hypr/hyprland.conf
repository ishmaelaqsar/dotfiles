# Hyprland. The keys follow the shared Super layout in bin/gnome-settings:
# Super launches and manages windows, and Super+x opens an Emacs-like chord
# for the window commands that have a C-x key in Emacs. The two desktops
# diverge on a few chords — the README's keybinding table is the reference.
#
# Machine-local settings (monitors, scale, a wallpaper) go in local.conf,
# which install.sh creates and the repo does not track. Wiki: https://wiki.hypr.land/

$mod = SUPER
$terminal = ghostty
$editor = emacsclient -c --alternate-editor=
$launcher = fuzzel
# The default browser, whatever it is, the way GNOME's www key opens it.
$browser = gtk-launch "$(xdg-settings get default-web-browser)"
$files = xdg-open ~
$lock = hyprlock

# -----------------------------
# Autostart
# -----------------------------
exec-once = waybar
exec-once = mako
# The scratchpad terminal. The window rule sends this class to the special
# workspace, so Super+grave drops it down over any workspace, the way a quick
# terminal does, with no portal and no extension.
exec-once = $terminal --class=com.mitchellh.ghostty.scratch

# -----------------------------
# Environment
# -----------------------------
# GTK apps read the Emacs key theme and the dark scheme from gsettings, which
# bin/gnome-settings sets on any box with gsettings, GNOME or not.
env = XCURSOR_SIZE,24

# -----------------------------
# Input
# -----------------------------
input {
    kb_layout = gb
    # Caps Lock as a second Control, as on GNOME and macOS.
    kb_options = ctrl:nocaps
    repeat_rate = 40
    repeat_delay = 250
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# -----------------------------
# Look
# -----------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(1f5fa8)
    col.inactive_border = rgb(3a3a3a)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = quick, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 3, quick
    animation = workspaces, 1, 3, quick, slide
    animation = fade, 1, 3, quick
}

dwindle {
    # Super+p toggles pseudo-tiling, and a split keeps its direction when a
    # window closes, so the Super+x 2 / Super+x 3 layout survives.
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

# -----------------------------
# Window rules
# -----------------------------
windowrule = workspace special:term silent, class:^(com\.mitchellh\.ghostty\.scratch)$
windowrule = float, class:^(com\.mitchellh\.ghostty\.scratch)$
windowrule = size 90% 50%, class:^(com\.mitchellh\.ghostty\.scratch)$
windowrule = move 5% 0, class:^(com\.mitchellh\.ghostty\.scratch)$

# -----------------------------
# Launch
# -----------------------------
bind = $mod, Return, exec, $terminal
bind = $mod, e, exec, $editor
bind = $mod, b, exec, $browser
bind = $mod, n, exec, $files
bind = $mod, space, exec, $launcher
bind = $mod, grave, togglespecialworkspace, term
bind = $mod, Escape, exec, $lock
bind = $mod SHIFT, s, exec, grim -g "$(slurp)" - | wl-copy
bind = $mod SHIFT, e, exit

# -----------------------------
# Windows
# -----------------------------
bind = $mod, q, killactive
bind = $mod, f, fullscreen, 0
bind = $mod, m, fullscreen, 1
bind = $mod, v, togglefloating
bind = $mod, p, pseudo
bind = $mod, s, togglesplit
bind = $mod, Tab, cyclenext
bind = $mod, Tab, alterzorder, top

# Focus with h j k l, move with Shift, resize with Ctrl. The arrows work too.
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

binde = $mod CTRL, h, resizeactive, -40 0
binde = $mod CTRL, j, resizeactive, 0 40
binde = $mod CTRL, k, resizeactive, 0 -40
binde = $mod CTRL, l, resizeactive, 40 0

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# -----------------------------
# Workspaces
# -----------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
# The GNOME pair, so the same hands work on both.
bind = $mod ALT, left, workspace, e-1
bind = $mod ALT, right, workspace, e+1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# -----------------------------
# Emacs chord: Super+x, then one key
# -----------------------------
# The window commands that have a C-x key in Emacs, on the same key:
#   0  close the window            (C-x 0 delete-window)
#   1  toggle full screen          (C-x 1 delete-other-windows)
#   2  the next window opens below (C-x 2 split-window-below)
#   3  the next window opens right (C-x 3 split-window-right)
#   o  focus the next window       (C-x o other-window)
# A key that no row claims does nothing, and Escape or C-g leaves the chord.
bind = $mod, x, submap, window
submap = window
bind = , 0, killactive
bind = , 0, submap, reset
bind = , 1, fullscreen, 0
bind = , 1, submap, reset
bind = , 2, layoutmsg, preselect d
bind = , 2, submap, reset
bind = , 3, layoutmsg, preselect r
bind = , 3, submap, reset
bind = , o, cyclenext
bind = , o, submap, reset
bind = , Escape, submap, reset
bind = CTRL, g, submap, reset
bind = , catchall, submap, reset
submap = reset

# -----------------------------
# Machine-local overrides, last so they win
# -----------------------------
source = ~/.config/hypr/local.conf
