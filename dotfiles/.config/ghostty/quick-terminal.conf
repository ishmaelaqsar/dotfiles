# Quake-style quick terminal — opt in per machine via config.local
# (automatic on macOS; needs Ghostty Accessibility permission there).
#
# Linux/Wayland: needs a wlr-layer-shell compositor (Hyprland/KDE/Sway yes,
# GNOME no), and the global keybind needs the compositor's XDG portal
# (Hyprland: xdg-desktop-portal-hyprland + a compositor-side bind).
#
# GNOME cannot do this at all — Mutter implements no layer shell. There
# `bin/gnome-settings apply` binds Super+` to a plain Ghostty window instead,
# which is the closest GNOME equivalent.

quick-terminal-position = top
quick-terminal-animation-duration = 0.2
quick-terminal-autohide = true

# cmd == super in Ghostty, so this line works on macOS and Linux alike
keybind = global:cmd+grave_accent=toggle_quick_terminal
