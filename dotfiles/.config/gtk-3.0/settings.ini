[Settings]
# GTK2 and GTK3 read this file directly. Under GNOME, gsettings holds the same
# keys and wins; under Hyprland there is no settings daemon, so a GTK app takes
# what is here and nothing else.
gtk-key-theme-name = Emacs

# Dark, to match ghostty, waybar, fuzzel and mako. Without this line a GTK
# dialogue opens light on the Hyprland session, whatever the theme is called.
gtk-application-prefer-dark-theme = 1
gtk-font-name = 0xProto Nerd Font Mono 11
