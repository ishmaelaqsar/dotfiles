# tmux — emacs-flavoured keys with a which-key menu layer.
#
# C-x is the leader, as it is in emacs. It is NOT the tmux `prefix`: tmux
# resolves the prefix key before it reads the root key table, so a real prefix
# swallows C-x and no binding can open a menu on it. So `prefix` is None, and
# C-x is bound in the root table to source menu/root.conf. Every leader key is
# a row in a menu under menu/.
#
# Two consequences worth knowing:
#   * A key that no menu row claims closes the menu and does nothing. C-g and
#     Escape therefore cancel, and a typo cannot fire the wrong command.
#   * A menu taller than the terminal does not draw, and its keys go with it.
#     Keep each menu under ~19 rows, which fits a 24-row terminal.
#
# In a pane that runs emacs or emacsclient the layer is off by itself: every
# root binding tests pane_current_command and sends the key through. C-x C-x
# sends one literal C-x for readline, and F12 turns the whole layer off for any
# other full-screen program; the status bar says so.

# -----------------------------
# Leader
# -----------------------------
set -g prefix  None
set -g prefix2 None

# In a pane that runs Emacs, C-x and every Alt key below are Emacs keys. Each
# binding tests the pane and sends the key through when it is. The command is
# "emacs", "emacsclient", or "Emacs" from the macOS bundle, so the match ignores
# case (m/i). F12 stays for other full-screen programs.
%hidden in_emacs='#{m/i:*emacs*,#{pane_current_command}}'

bind -T root C-x if -F "$in_emacs" 'send-keys C-x' 'source-file -q ~/.config/tmux/menu/root.conf'

# Suspend every tmux key, so a full-screen program owns the keyboard.
bind -T root F12 { set key-table off ; refresh-client -S }
bind -T off  F12 { set -u key-table ; refresh-client -S }

# -----------------------------
# Behaviour
# -----------------------------
# tmux-256color carries italics and 256 colours, but it lives in ncurses-term,
# which a minimal Debian does not install. Fall back rather than fail to start.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' {
    set -g default-terminal 'tmux-256color'
} {
    set -g default-terminal 'screen-256color'
}
set -as terminal-features ',*:RGB'
# That line tells tmux about colour. The programs inside read COLORTERM, because
# the tmux-256color terminfo entry has no RGB flag. Emacs is one of them.
set-environment -g COLORTERM truecolor

set -g  mode-keys        emacs
set -g  status-keys      emacs
set -g  base-index       1
setw -g pane-base-index  1
set -g  renumber-windows on
set -g  escape-time      10
set -g  history-limit    50000
set -g  focus-events     on
set -g  mouse            on
setw -g aggressive-resize on
set -g  display-time     2000
set -g  set-titles       on
set -g  set-titles-string '#S:#I #W'

# Killing a session moves this client to the most recently used *detached*
# session, so it never doubles up on a session another client already shows,
# and with nothing detached left it detaches cleanly. This also makes killing
# the current session from the session picker land somewhere sane. no-detached
# needs tmux 3.4; an older tmux keeps the default (on: plain detach). The
# version reads "3.3a", so strip the letter before the compare, and |0 keeps a
# false result as "0" -- the bare "0.00" from |f would read as true in %if.
%if "#{e|>=|f|0:#{s/[a-z]//g:version},3.4}"
set -g detach-on-destroy no-detached
%else
set -g detach-on-destroy on
%endif

# -----------------------------
# Clipboard
# -----------------------------
# set-clipboard uses OSC 52, so a copy inside tmux over ssh still reaches the
# local clipboard. copy-command covers the local case and terminals with OSC 52
# turned off. .aliases maps pbcopy onto wl-copy for the shell, but tmux runs no
# shell aliases, so test for both binaries here.
set -g set-clipboard on
if-shell 'command -v pbcopy >/dev/null 2>&1' {
    set -s copy-command 'pbcopy'
}
if-shell '! command -v pbcopy >/dev/null 2>&1 && command -v wl-copy >/dev/null 2>&1' {
    set -s copy-command 'wl-copy'
}

# Copy what the mouse selects, to match copy-on-select in the Ghostty config.
# copy-pipe-no-clear with no argument pipes through copy-command.
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode C-g              send -X cancel
bind -T copy-mode q                send -X cancel

# -----------------------------
# Direct keys, no leader
# -----------------------------
# Alt shadows the readline word keys (M-f, M-b, M-l, M-k). An Emacs pane gets
# them through the guard above; F12 hands them back anywhere else.
bind -T root M-Left if -F "$in_emacs" 'send-keys M-Left' 'select-pane -L'
bind -T root M-Down if -F "$in_emacs" 'send-keys M-Down' 'select-pane -D'
bind -T root M-Up if -F "$in_emacs" 'send-keys M-Up' 'select-pane -U'
bind -T root M-Right if -F "$in_emacs" 'send-keys M-Right' 'select-pane -R'
bind -T root M-h if -F "$in_emacs" 'send-keys M-h' 'select-pane -L'
bind -T root M-j if -F "$in_emacs" 'send-keys M-j' 'select-pane -D'
bind -T root M-k if -F "$in_emacs" 'send-keys M-k' 'select-pane -U'
bind -T root M-l if -F "$in_emacs" 'send-keys M-l' 'select-pane -R'

bind -T root M-S-Left if -F "$in_emacs" 'send-keys M-S-Left' 'swap-pane -s "{left-of}"'
bind -T root M-S-Down if -F "$in_emacs" 'send-keys M-S-Down' 'swap-pane -s "{down-of}"'
bind -T root M-S-Up if -F "$in_emacs" 'send-keys M-S-Up' 'swap-pane -s "{up-of}"'
bind -T root M-S-Right if -F "$in_emacs" 'send-keys M-S-Right' 'swap-pane -s "{right-of}"'

bind -T root M-n if -F "$in_emacs" 'send-keys M-n' 'split-window -h -c "#{pane_current_path}"'
bind -T root M-i if -F "$in_emacs" 'send-keys M-i' 'swap-window -t -1'
bind -T root M-o if -F "$in_emacs" 'send-keys M-o' 'swap-window -t +1'
bind -T root M-[ if -F "$in_emacs" 'send-keys M-[' 'previous-layout'
bind -T root M-] if -F "$in_emacs" 'send-keys M-]' 'next-layout'

bind -T root M-f if -F "$in_emacs" 'send-keys M-f' 'display-popup -w 80% -h 80% -d "#{pane_current_path}" -E "$SHELL"'

# M-x prompts for a tmux command, as it prompts for a command in emacs. M-s
# opens the session picker (bin/tmux-sessions, also on C-x C-o s).
bind -T root M-x if -F "$in_emacs" 'send-keys M-x' 'command-prompt'
bind -T root M-s if -F "$in_emacs" 'send-keys M-s' 'display-popup -w 80% -h 60% -d "#{pane_current_path}" -E tmux-sessions'

# -----------------------------
# Look
# -----------------------------
# Basic ANSI colours only, so the bar follows whatever palette the terminal
# theme sets and still reads correctly on a host reached over ssh.
set -g pane-border-style        'fg=brightblack'
set -g pane-active-border-style 'fg=cyan'
set -g pane-border-lines        heavy
set -g pane-border-indicators   both

# Label each pane along its top border, but only when the window holds more
# than one pane. A lone pane needs no label, and the label row would cost it a
# line. The hook fires on split, kill, break, and join.
set -g pane-border-status off
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'

# The label shows the pane index and command. It adds the pane title when a
# program set one, and the default title is the hostname, so test against
# both forms. Border styles ignore attributes, so bold lives here instead.
set -g pane-border-format '#{?pane_active,#[fg=black#,bg=cyan#,bold],#[fg=brightblack#,dim]} #{pane_index} #{pane_current_command}#{?#{&&:#{n:pane_title},#{&&:#{!=:#{pane_title},#{host}},#{!=:#{pane_title},#{host_short}}}}, [#{pane_title}],} #[default]'

set -g menu-style          'bg=default,fg=white'
set -g menu-selected-style 'bg=cyan,fg=black,bold'
set -g menu-border-style   'fg=cyan'
set -g menu-border-lines   rounded

set -g popup-style        'bg=default'
set -g popup-border-style 'fg=cyan'
set -g popup-border-lines rounded

set -g status-position bottom
set -g status-style    'bg=default,fg=white'
set -g status-interval 5
set -g status-left-length  40
set -g status-right-length 60

# The left segment doubles as the state light: it turns yellow and says KEYS
# OFF while F12 holds the layer down, because every key looks broken then.
set -g status-left '#{?#{==:#{client_key_table},off},#[fg=black#,bg=yellow#,bold] KEYS OFF ,#[fg=black#,bg=cyan#,bold] #S }#[default] '
set -g status-right '#{?pane_synchronized,#[fg=black#,bg=red#,bold] SYNC #[default] ,}#[fg=brightblack]#h #[fg=white]%H:%M '

set -g  window-status-format         ' #I:#W#{?window_flags,#{window_flags}, } '
set -g  window-status-current-format '#[fg=black,bg=white,bold] #I:#W#{?window_flags,#{window_flags}, } #[default]'
set -g  window-status-separator      ''
