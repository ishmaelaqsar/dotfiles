# C-x C-t. next, previous and the two move rows hold the menu open.
display-menu -T '#[align=centre,fg=cyan,bold] window ' -x C -y S \
    'new window'   c 'new-window -c "#{pane_current_path}"' \
    'rename'       , 'command-prompt -I "#W" -p "window name:" "rename-window -- %%"' \
    'next'         n 'next-window ; source-file -q ~/.config/tmux/menu/window.conf' \
    'previous'     p 'previous-window ; source-file -q ~/.config/tmux/menu/window.conf' \
    'last window'  Tab 'last-window' \
    '' \
    'window list'  b 'choose-tree -Zw' \
    'find text in a window' f 'command-prompt -p "find:" "find-window -- %%"' \
    'go to number' g 'command-prompt -p "window:" "select-window -t :%%"' \
    '' \
    'move left'    [ 'swap-window -t -1 ; source-file -q ~/.config/tmux/menu/window.conf' \
    'move right'   ] 'swap-window -t +1 ; source-file -q ~/.config/tmux/menu/window.conf' \
    'move to number' . 'command-prompt -p "move to:" "move-window -t :%%"' \
    '' \
    'kill window'  '&' 'confirm-before -p "kill window #W? (y/n)" kill-window'
