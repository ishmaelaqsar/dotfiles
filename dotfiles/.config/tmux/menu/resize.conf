# C-x C-n. Every border row holds the menu open, so the keys repeat: h j k l
# steps, H J K L trims by one cell. The direction is tmux's own -- "border
# left" pushes the border left, which grows or shrinks depending on the side
# the pane sits on.
display-menu -T '#{@title_style} resize ' -x C -y S \
    'border left'   h 'resize-pane -L 5 ; source-file -q ~/.config/tmux/menu/resize.conf' \
    'border down'   j 'resize-pane -D 3 ; source-file -q ~/.config/tmux/menu/resize.conf' \
    'border up'     k 'resize-pane -U 3 ; source-file -q ~/.config/tmux/menu/resize.conf' \
    'border right'  l 'resize-pane -R 5 ; source-file -q ~/.config/tmux/menu/resize.conf' \
    '' \
    'border left  by one'  H 'resize-pane -L 1 ; source-file -q ~/.config/tmux/menu/resize.conf' \
    'border down  by one'  J 'resize-pane -D 1 ; source-file -q ~/.config/tmux/menu/resize.conf' \
    'border up    by one'  K 'resize-pane -U 1 ; source-file -q ~/.config/tmux/menu/resize.conf' \
    'border right by one'  L 'resize-pane -R 1 ; source-file -q ~/.config/tmux/menu/resize.conf' \
    '' \
    'tile evenly'  = 'select-layout tiled' \
    'next layout'  n 'next-layout' \
    'zoom pane'    1 'resize-pane -Z'
