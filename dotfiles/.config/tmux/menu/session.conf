# C-x C-o. next and previous hold the menu open.
display-menu -T '#[align=centre,fg=cyan,bold] session ' -x C -y S \
    'session list'  w 'choose-tree -Zs' \
    'session picker' s 'display-popup -w 80% -h 60% -d "#{pane_current_path}" -T "#[align=centre,fg=cyan,bold] sessions " -E tmux-sessions' \
    'next'          n 'switch-client -n ; source-file -q ~/.config/tmux/menu/session.conf' \
    'previous'      p 'switch-client -p ; source-file -q ~/.config/tmux/menu/session.conf' \
    'last session'  L 'switch-client -l' \
    '' \
    'new session'   N 'command-prompt -p "new session:" "new-session -s %%"' \
    'rename'        r 'command-prompt -I "#S" -p "session name:" "rename-session -- %%"' \
    'detach'        d 'detach-client' \
    '' \
    'kill this session' X 'confirm-before -p "kill session #S? (y/n)" kill-session' \
    'reload the config' R 'source-file ~/.config/tmux/tmux.conf ; display-message "tmux.conf reloaded"'
