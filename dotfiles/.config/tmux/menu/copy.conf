# C-x C-s. Copy mode itself is emacs-keyed: C-v and M-v page, M-w copies,
# C-Space sets the mark, C-s searches on, C-g leaves.
display-menu -T '#{@title_style} copy ' -x C -y S \
    'copy mode'        s 'copy-mode' \
    'search back'      C-r 'copy-mode ; command-prompt -p "search up:"   "send-keys -X search-backward -- %%"' \
    'search on'        C-s 'copy-mode ; command-prompt -p "search down:" "send-keys -X search-forward -- %%"' \
    '' \
    'top of history'   M-< 'copy-mode ; send-keys -X history-top' \
    'end of history'   M-> 'copy-mode ; send-keys -X history-bottom' \
    '' \
    'paste'            y 'paste-buffer -p' \
    'buffer list'      b 'choose-buffer -Z' \
    'clear this history' C-k 'clear-history ; display-message "history cleared"'
