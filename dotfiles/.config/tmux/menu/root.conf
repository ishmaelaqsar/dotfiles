# The C-x menu. The C-x binding in tmux.conf sources this file, and so does
# every row that stays open, so this file is the one copy of the menu.
#
# No row may use an arrow key: a tmux menu keeps the whole arrow family for
# moving its own selection, so an arrow row would be a dead key. Pane moves
# therefore live on H J K L in the pane menu, and on M-S-<arrow> with no leader.
#
# The letter rows keep their emacs parallels: 2 3 0 1 o mirror C-x 2/3/0/1/o,
# k kills like kill-buffer, C-b lists windows like list-buffers, and C-c
# detaches like save-buffers-kill-terminal. Tab and b live in the window menu.
display-menu -T '#{@title_style} C-x ' -x C -y S \
    'split below'  2 'split-window -v -c "#{pane_current_path}"' \
    'split right'  3 'split-window -h -c "#{pane_current_path}"' \
    'kill pane'    0 'kill-pane' \
    'zoom pane'    1 'resize-pane -Z' \
    'other pane'   o 'select-pane -t :.+' \
    '' \
    'new window'   c 'new-window -c "#{pane_current_path}"' \
    'kill window'  k 'confirm-before -p "kill window #W? (y/n)" kill-window' \
    'window list'  C-b 'choose-tree -Zw' \
    'detach'       C-c 'detach-client' \
    '' \
    'pane    >'    C-p 'source-file -q ~/.config/tmux/menu/pane.conf' \
    'window  >'    C-t 'source-file -q ~/.config/tmux/menu/window.conf' \
    'resize  >'    C-n 'source-file -q ~/.config/tmux/menu/resize.conf' \
    'session >'    C-o 'source-file -q ~/.config/tmux/menu/session.conf' \
    'copy    >'    C-s 'source-file -q ~/.config/tmux/menu/copy.conf' \
    'tools   >'    t   'source-file -q ~/.config/tmux/menu/tools.conf' \
    'literal C-x to the pane' C-x 'send-keys C-x' \
    'keys that need no C-x'   ?   'display-popup -w 80% -h 80% -d "#{pane_current_path}" -T "#{@title_style} keys — / search, SPACE pages, q quit " -E "tmux list-keys -T root | sort | less -S"'
