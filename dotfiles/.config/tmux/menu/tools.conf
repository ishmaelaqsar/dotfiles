# C-x t. Each row opens a full-screen tool in a popup, so it borrows the whole
# terminal and gives it back on exit.
#
# Two rules hold this file together. A tmux string in single quotes admits no
# single quote inside it, so every command below uses bare words. And `{` opens
# a command block in tmux config, so the guard is written with if/then/fi rather
# than with braces.
#
# Each row names its common keys in the popup border title. tmux draws the
# border, so the hint stays visible while a full-screen program owns the inside
# of the popup. The machines row is the exception: `vm` shows its own keys in
# the fzf picker, so the hint follows the script outside tmux as well.
display-menu -T '#[align=centre,fg=cyan,bold] tools ' -x C -y S \
    'git'        g 'display-popup -w 90% -h 90% -d "#{pane_current_path}" -T "#[align=centre,fg=cyan,bold] git — TAB expand, s stage, c c commit, P p push, ? keys " -E "emacsclient -t --alternate-editor= -e \"(magit-status)\""' \
    'containers' d 'display-popup -w 90% -h 90% -d "#{pane_current_path}" -T "#[align=centre,fg=cyan,bold] containers — x menu, b bulk, enter runs, q quit " -E "if command -v lazydocker >/dev/null; then exec lazydocker; else echo lazydocker is not installed; sleep 2; fi"' \
    '' \
    'machines'   v 'display-popup -w 80% -h 80% -d "#{pane_current_path}" -T "#[align=centre,fg=cyan,bold] machines " -E "if command -v vm >/dev/null; then vm; echo; echo Enter closes this; read _; else echo vm is not on PATH; sleep 2; fi"' \
    '' \
    'processes'  p 'display-popup -w 90% -h 90% -d "#{pane_current_path}" -T "#[align=centre,fg=cyan,bold] processes — h help, k kill, q quit " -E "if command -v btop >/dev/null; then exec btop; elif command -v htop >/dev/null; then exec htop; else echo no htop; sleep 2; fi"' \
    'disk use'   u 'display-popup -w 90% -h 90% -d "#{pane_current_path}" -T "#[align=centre,fg=cyan,bold] disk use — ? help, d delete, q quit " -E "if command -v ncdu >/dev/null; then exec ncdu; else echo ncdu is not installed; sleep 2; fi"'
