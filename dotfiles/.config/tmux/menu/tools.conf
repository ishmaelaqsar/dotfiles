# C-x t. Each row opens a full-screen tool in a popup, so it borrows the whole
# terminal and gives it back on exit.
#
# Two rules hold this file together. A tmux string in single quotes admits no
# single quote inside it, so every command below uses bare words. And `{` opens
# a command block in tmux config, so the guard is written with if/then/fi rather
# than with braces.
#
# Every row tests its precondition before it starts anything: the tool has to
# be installed, and the git row has to be inside a repository. -E closes the
# popup as soon as its command exits, so an unguarded row flashes and goes.
#
# Each row names its common keys in the border title, which tmux keeps drawn
# while a full-screen program owns the inside. The machines row is the
# exception: `vm` names its keys in the fzf picker, which works outside tmux
# as well.
display-menu -T '#{@title_style} tools ' -x C -y S \
    'git'        g 'display-popup -w 90% -h 90% -d "#{pane_current_path}" -T "#{@title_style} git — TAB expand, s stage, c c commit, P p push, ? keys " -E "if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then exec emacsclient -t --alternate-editor= -e \"(if (fboundp (quote my/magit-popup)) (my/magit-popup) (magit-status))\"; else echo not a git repository; sleep 2; fi"' \
    'containers' d 'display-popup -w 90% -h 90% -d "#{pane_current_path}" -T "#{@title_style} containers — x menu, b bulk, enter runs, q quit " -E "if command -v lazydocker >/dev/null; then if lazydocker; then :; else echo; echo Enter closes this; read _; fi; else echo lazydocker is not installed; sleep 2; fi"' \
    '' \
    'machines'   v 'display-popup -w 80% -h 80% -d "#{pane_current_path}" -T "#{@title_style} machines " -E "if command -v vm >/dev/null; then vm; echo; echo Enter closes this; read _; else echo vm is not on PATH; sleep 2; fi"' \
    '' \
    'processes'  p 'display-popup -w 90% -h 90% -d "#{pane_current_path}" -T "#{@title_style} processes — h help, k kill, q quit " -E "if command -v htop >/dev/null; then exec htop; else echo htop is not installed; sleep 2; fi"' \
    'disk use'   u 'display-popup -w 90% -h 90% -d "#{pane_current_path}" -T "#{@title_style} disk use — ? help, d delete, q quit " -E "if command -v ncdu >/dev/null; then exec ncdu; else echo ncdu is not installed; sleep 2; fi"'
