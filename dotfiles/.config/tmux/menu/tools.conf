# C-x t. Each row opens a full-screen tool in a popup, so it borrows the whole
# terminal and gives it back on exit.
#
# Two rules hold this file together. A tmux string in single quotes admits no
# single quote inside it, so every command below uses bare words. And `{` opens
# a command block in tmux config, so the guard is written with if/then/fi rather
# than with braces.
display-menu -T '#[align=centre,fg=cyan,bold] tools ' -x C -y S \
    'git'        g 'display-popup -w 90% -h 90% -E "emacsclient -t --alternate-editor= -e \"(magit-status)\""' \
    'containers' d 'display-popup -w 90% -h 90% -E "if command -v lazydocker >/dev/null; then exec lazydocker; else echo lazydocker is not installed; sleep 2; fi"' \
    '' \
    'machines'   v 'display-popup -w 80% -h 80% -E "if command -v vm >/dev/null; then vm; echo; echo Enter closes this; read _; else echo vm is not on PATH; sleep 2; fi"' \
    '' \
    'processes'  p 'display-popup -w 90% -h 90% -E "if command -v btop >/dev/null; then exec btop; elif command -v htop >/dev/null; then exec htop; else echo no htop; sleep 2; fi"' \
    'disk use'   u 'display-popup -w 90% -h 90% -E "if command -v ncdu >/dev/null; then exec ncdu; else echo ncdu is not installed; sleep 2; fi"'
