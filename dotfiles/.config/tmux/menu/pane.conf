# C-x C-p. The focus and move rows hold the menu open, so h j k l walks the
# panes and H J K L drags one around. M-S-<arrow> does the same with no leader.
display-menu -T '#[align=centre,fg=cyan,bold] pane ' -x C -y S \
    'focus left'   h 'select-pane -L ; source-file -q ~/.config/tmux/menu/pane.conf' \
    'focus down'   j 'select-pane -D ; source-file -q ~/.config/tmux/menu/pane.conf' \
    'focus up'     k 'select-pane -U ; source-file -q ~/.config/tmux/menu/pane.conf' \
    'focus right'  l 'select-pane -R ; source-file -q ~/.config/tmux/menu/pane.conf' \
    '' \
    'move left'    H 'swap-pane -s "{left-of}"  ; source-file -q ~/.config/tmux/menu/pane.conf' \
    'move down'    J 'swap-pane -s "{down-of}"  ; source-file -q ~/.config/tmux/menu/pane.conf' \
    'move up'      K 'swap-pane -s "{up-of}"    ; source-file -q ~/.config/tmux/menu/pane.conf' \
    'move right'   L 'swap-pane -s "{right-of}" ; source-file -q ~/.config/tmux/menu/pane.conf' \
    '' \
    'floating shell'   e 'display-popup -w 80% -h 80% -d "#{pane_current_path}" -T "#[align=centre,fg=cyan,bold] shell — C-d closes it " -E "$SHELL"' \
    'break out to its own window' '!' 'break-pane' \
    'mark / unmark'        m 'select-pane -m' \
    'join the marked pane' M 'join-pane -s "{marked}"' \
    'type into every pane' s 'setw synchronize-panes' \
    '' \
    'kill pane'  0 'kill-pane' \
    'zoom pane'  1 'resize-pane -Z'
