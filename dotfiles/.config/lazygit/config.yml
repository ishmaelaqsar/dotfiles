# lazygit configuration.
#
# On Linux lazygit reads ~/.config/lazygit/config.yml. On macOS it reads
# ~/Library/Application Support/lazygit/ instead, so .bash_profile exports
# LG_CONFIG_FILE to point at this file on both platforms.
#
# The editor is left out on purpose: .bash_profile already resolves EDITOR,
# VISUAL and GIT_EDITOR (VS Code where it exists, vi otherwise), and lazygit
# reads those. A theme is left out too — lazygit uses the terminal's colours,
# so the Ghostty theme already applies.

git:
  paging:
    colorArg: always
    # lazygit runs its own `git diff` and ignores core.pager, so delta is named
    # again here. Three parts, each needed:
    #   --paging=never    delta must not start a pager inside lazygit's panel
    #   --no-gitconfig    ignore the machine's [delta] settings. A machine that
    #                     sets side-by-side globally is unreadable in a panel
    #                     this narrow, and delta cannot turn it off per call.
    #   --dark            the terminal theme is dark
    pager: delta --no-gitconfig --dark --paging=never

gui:
  # install.sh installs the 0xProto Nerd Font, a v3 build
  nerdFontsVersion: "3"

customCommands:
  # git-gone lives in .helpers, so it needs a login shell to be defined.
  # Ctrl-G, not a plain letter, to avoid shadowing a built-in branch binding.
  - key: "<c-g>"
    context: "localBranches"
    description: "Delete local branches whose upstream is gone (git-gone)"
    command: "bash -lc 'git-gone'"
    loadingText: "Pruning branches whose upstream is gone"
    subprocess: true
