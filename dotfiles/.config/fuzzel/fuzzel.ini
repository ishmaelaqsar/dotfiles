# fuzzel — the app launcher on Super+Space under Hyprland. The default keys are
# already Emacs keys: C-n and C-p move, C-g cancels.
font=0xProto Nerd Font Mono:size=12
prompt="> "
# Without this, a desktop entry marked Terminal=true opens in fuzzel's
# fallback, xterm, which nothing here installs, so the entry does nothing.
terminal=ghostty -e
lines=12
width=48
horizontal-pad=16
vertical-pad=12

[colors]
background=1a1a17ff
text=fdfdfbff
match=1f5fa8ff
selection=1f5fa8ff
selection-text=fdfdfbff
selection-match=fdfdfbff
border=1f5fa8ff

[border]
width=2
radius=0
