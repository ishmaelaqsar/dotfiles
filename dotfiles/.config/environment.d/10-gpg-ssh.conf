# systemd user environment. The GNOME session imports it, so graphical apps
# (VS Code, GNOME apps) use the same SSH agent as the shell does in .bashrc.
# Without this line GNOME's own agent owns SSH_AUTH_SOCK for GUI apps, and the
# YubiKey never gets asked.
#
# %t is the user runtime directory, /run/user/<uid>.
# install.sh masks GNOME's agent and enables gpg-agent-ssh.socket.
SSH_AUTH_SOCK=%t/gnupg/S.gpg-agent.ssh
