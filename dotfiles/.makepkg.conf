# Arch: per-user overrides on top of /etc/makepkg.conf, which makepkg sources
# first. Only the two settings below change; everything else stays default.
# makepkg reads this file with bash, so command substitution works.

# Build with every core. The stock MAKEFLAGS is single-threaded.
MAKEFLAGS="-j$(nproc)"

# Do not compress the built package. An AUR package is installed at once and
# then thrown away, so the compression time buys nothing.
PKGEXT='.pkg.tar'
