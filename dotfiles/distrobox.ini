[arch]
image=quay.io/toolbx/arch-toolbox:latest
pull=true
root=false
replace=true
home=/opt/distrobox/arch
init=false
start_now=true
nvidia=true

# mount host's ~/bin directory as /usr/local/bin within the container
volume=~/bin:/usr/local/bin:rw

additional_packages="coreutils binutils findutils which grep sed"
additional_packages="vim make gcc glibc gdb gnupg gawk gzip"
additional_packages="git make python python-pip perl cpanminus"
additional_packages="ca-certificates curl openssl wget tmux tar"
additional_packages="zip unzip xclip ctags fzf ripgrep"

# Install the dotfiles into the container's own home (/opt/distrobox/arch).
#
# init_hooks, not pre_init_hooks: a pre-init hook runs before the packages
# above are installed, and install.sh needs python and git to run at all.
#
# The path is the host's, not the container's. `home=` above makes $HOME
# /opt/distrobox/arch inside the container, so `~/.dotfiles` would point at a
# directory that does not exist. distrobox mounts the host home at its normal
# path and creates the same user, so /home/$USER reaches the real checkout.
init_hooks="/home/$USER/.dotfiles/install.sh;"
