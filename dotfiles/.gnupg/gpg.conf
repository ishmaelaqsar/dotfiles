# https://github.com/ishmaelaqsar/YubiKey-Guide/blob/master/config/gpg.conf
# https://www.gnupg.org/documentation/manuals/gnupg/GPG-Options.html
# `gpg --version` lists the algorithms this build supports.
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256
charset utf-8
no-comments
no-emit-version
no-greeting
keyid-format 0xlong
list-options show-uid-validity
verify-options show-uid-validity
with-fingerprint
require-cross-certification
# Lock memory, so the secret key material never reaches the swap on disk.
require-secmem
# No agent cache for a symmetric passphrase, so one decrypt does not unlock
# the next.
no-symkey-cache
armor
use-agent
# Hide the recipient key IDs. Mailvelope cannot decrypt a message without them.
throw-keyids
