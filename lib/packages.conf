# Package table for install.sh and setup-*.sh. Read by lib/pkg.sh.
#
#   commands | tags | per-manager package overrides
#
# commands   Command names that satisfy this row, comma separated. The first
#            one is the identity, and the default package name. A `~` prefix
#            means no command answers to it, so `command -v` cannot test it
#            (a shell script, a daemon in sbin, a USB driver): the doctor
#            reports it as unverifiable instead of missing.
# tags       install.sh installs a row when ALL of its tags are active. Active
#            tags: base always; linux off macOS; desktop on a graphical box;
#            arch where pacman exists. `toolchain` and `virt` are never active —
#            those rows only map a name, for a setup-*.sh script and for bin/vm.
#            Every row needs at least one tag.
# overrides  `mgr=pkg` pairs. An exact manager wins, then `*=pkg`, then the
#            first command name. Managers: brew apt pacman yay paru dnf.

eza                                                   | base
fzf                                                   | base
tmux                                                  | base
gpg,gpg2                                              | base       | *=gnupg dnf=gnupg2
rg                                                    | base       | *=ripgrep
delta                                                 | base       | *=git-delta
lazydocker                                            | base
bat,batcat                                            | base
htop                                                  | base
ncdu                                                  | base
starship                                              | base
fd,fdfind                                             | base       | apt=fd-find dnf=fd-find
~bash-completion                                      | base       | brew=bash-completion@2
pinentry,pinentry-mac,pinentry-gnome3,pinentry-curses | base       | brew=pinentry-mac apt=pinentry-gnome3

# Smartcard stack for the YubiKey. dotfiles/.gnupg/scdaemon.conf sets
# disable-ccid, so the card goes through PC/SC. macOS has PC/SC built in.
# Linux needs the pcscd daemon plus the ccid USB reader driver.
~pcscd                                                | linux      | apt=pcscd dnf=pcsc-lite *=pcsclite
~ccid                                                 | linux      | apt=libccid dnf=pcsc-lite-ccid

# Wayland clipboard. .aliases maps pbcopy/pbpaste onto it.
wl-copy                                               | linux desktop | *=wl-clipboard

# Arch upkeep: paccache trims the package cache, and pacman-contrib also
# brings checkupdates and pacdiff, which .aliases wraps.
paccache                                              | arch       | *=pacman-contrib

# Toolchain rows: name mappings for setup-*.sh, never installed by install.sh.
go                                                    | toolchain  | apt=golang dnf=golang
clangd                                                | toolchain  | pacman=clang yay=clang paru=clang dnf=clang-tools-extra
# Pure-GTK builds on Linux for the Wayland desktops. Fedora's plain emacs is
# pgtk already. The brew formula lives in a tap that setup-emacs.sh adds, and
# is pinned to 30 because Debian trixie ships 30 for its whole life.
emacs                                                 | toolchain  | apt=emacs-pgtk pacman=emacs-wayland yay=emacs-wayland paru=emacs-wayland brew=emacs-plus@30

# The libvirt stack that bin/vm drives. The `virt` tag is never active: vm is
# optional, so install.sh must not pull the stack in, and the doctor must not
# report it as missing. The rows exist to name the package per manager.
virsh                                                 | virt       | apt=libvirt-clients dnf=libvirt-client *=libvirt
virt-install                                          | virt       | apt=virtinst brew=virt-manager
~libvirtd                                             | virt       | apt=libvirt-daemon-system dnf=libvirt-daemon-kvm *=libvirt
