name: ci

# What a push must not break: the two packages.conf parsers must agree, every
# shell script must pass shellcheck, the Emacs Lisp must compile and load, and
# a Debian container must still install and clean up. The smoke test is the
# slow one, so it runs last and only for the branches that matter.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    name: package table parsers agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lib/pkg.sh vs lib/pkgconf.py
        run: bash test/pkg-parity.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: every tracked file with a sh or bash shebang
        # Warning and up. SC1091 is information only, and fires on every
        # `source lib/...` that shellcheck will not follow. The list comes from
        # git, so a new script is linted the day it lands. head reads one line
        # per file, so a binary in the tree is harmless.
        run: |
          git ls-files -z | while IFS= read -r -d '' f; do
            head -n 1 "$f" | grep -qE '^#!.*(/|env +)(ba)?sh( |$)' && printf '%s\0' "$f"
          done | xargs -0 shellcheck -x --severity=warning

  python:
    name: python scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: byte-compile every python entry point
        run: |
          python3 -m py_compile \
            bin/vm bin/dotfiles bin/manage-secrets bin/gnome-settings \
            lib/sync-dotfiles lib/pkgconf.py

  elisp:
    name: emacs lisp compiles and the init loads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: debian container, the Emacs the Linux machines run
        # Debian stable carries Emacs 30, the oldest version the init must load
        # on. The config is copied, not linked: the package install writes
        # elpa/ beside it, and the repository mount is read-only.
        run: |
          docker run --rm -v "$PWD":/repo:ro debian:stable bash -eu -c '
            apt-get update -qq && apt-get install -y -qq emacs-nox >/dev/null
            mkdir -p ~/.config && cp -r /repo/dotfiles/.config/emacs ~/.config/emacs
            cd ~/.config/emacs
            emacs --batch -l early-init.el --eval "(package-initialize)" -l init.el \
              --eval "(progn (package-refresh-contents) (package-install-selected-packages t))"
            emacs --batch -l early-init.el --eval "(package-initialize)" \
              --eval "(setq byte-compile-error-on-warn t)" -L lisp -f batch-byte-compile lisp/*.el
            emacs --batch -l early-init.el --eval "(package-initialize)" -l init.el --eval "(kill-emacs)"
          '

  smoke:
    name: debian install and cleanup
    runs-on: ubuntu-latest
    needs: [parity, shellcheck, python, elisp]
    steps:
      - uses: actions/checkout@v4
      - name: quick smoke test in a container
        run: |
          docker run --rm -v "$PWD":/repo:ro debian:stable \
            bash /repo/test/linux-smoke.sh quick
