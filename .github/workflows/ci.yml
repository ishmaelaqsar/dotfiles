name: ci

# What a push must not break: the two packages.conf parsers must agree, every
# shell script must pass shellcheck, and a Debian container must still install
# and clean up. The smoke test is the slow one, so it runs last and only for
# the branches that matter.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    name: package table parsers agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lib/pkg.sh vs lib/pkgconf.py
        run: bash test/pkg-parity.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: scripts and installers
        # Warning and up. SC1091 is information only, and fires on every
        # `source lib/...` that shellcheck will not follow.
        run: |
          shellcheck -x --severity=warning \
            install.sh cleanup.sh setup-*.sh \
            bin/git-gone bin/md2org bin/ediff bin/tmux-sessions bin/docker \
            lib/pkg.sh lib/gitconfig.sh \
            hooks/pre-commit hooks/pre-push hooks/scan-added-lines \
            test/pkg-parity.sh test/linux-smoke.sh

  python:
    name: python scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: byte-compile every python entry point
        run: |
          python3 -m py_compile \
            bin/vm bin/dotfiles bin/manage-secrets bin/gnome-settings \
            lib/sync-dotfiles lib/pkgconf.py

  smoke:
    name: debian install and cleanup
    runs-on: ubuntu-latest
    needs: [parity, shellcheck, python]
    steps:
      - uses: actions/checkout@v4
      - name: quick smoke test in a container
        run: |
          docker run --rm -v "$PWD":/repo:ro debian:stable \
            bash /repo/test/linux-smoke.sh quick
